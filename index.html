<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ViuWeb.com - Premium Domain For Sale</title>
    <style>
        /* CSS AVANZADO PARA PANTALLA COMPLETA FLUIDA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden; /* Evita barras de desplazamiento */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            position: relative;
            width: 100vw; /* 100% del ancho de la ventana */
            height: 100vh; /* 100% del alto de la ventana */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            padding: 10px;
        }

        /* Efecto de fondo dinámico sutil */
        .lightning-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.ibb.co/59T4B33/lightning-texture.png') repeat; /* Textura de relámpago muy sutil */
            opacity: 0.03; /* Muy tenue para no molestar */
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            max-width: 700px;
            width: 100%;
        }

        .domain-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #60a5fa; /* Azul eléctrico */
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        h1.main-headline {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.7);
        }

        .sub-headline {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #9ca3af; /* Gris claro */
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 3rem;
        }

        .contact-button {
            display: inline-block;
            padding: 15px 30px;
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 600;
            color: #ffffff;
            background-color: transparent;
            border: 2px solid #60a5fa;
            border-radius: 50px; /* Botón ovalado */
            text-decoration: none;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .contact-button:hover {
            background-color: #60a5fa;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.8);
            transform: scale(1.05); /* Efecto de crecimiento suave al pasar el mouse */
        }

        /* Ajuste para tablets en orientación horizontal */
        @media (min-width: 768px) and (orientation: landscape) {
            .main-container {
                padding: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="lightning-overlay"></div>
        <div class="content-wrapper">
            <div class="domain-title">ViuWeb.com</div>
            <h1 class="main-headline">Domain For Sale</h1>
            <p class="sub-headline">Premium Digital Asset</p>
            <a href="mailto:webdominiosvegas@gmail.com" class="contact-button">webdominiosvegas@gmail.com</a>
        </div>
    </div>

</body>
</html>
