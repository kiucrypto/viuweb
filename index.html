<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viuweb.com - Premium Domain For Sale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #0a0a16 0%, #000000 100%);
            padding: 20px;
        }

        /* Efecto de relámpagos sutiles de fondo */
        .lightning-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.05) 0%, transparent 50%, rgba(0, 150, 255, 0.05) 100%);
            pointer-events: none;
        }

        .content {
            z-index: 2;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 162, 255, 0.6);
        }

        .domain-name {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #3b82f6;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .contact-box {
            display: inline-block;
            padding: 14px 28px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 8px;
            color: #60a5fa;
            text-decoration: none;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .contact-box:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: #60a5fa;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lightning-bg"></div>
        <div class="content">
            <div class="domain-name">viuweb.com</div>
            <h1>Domain For Sale</h1>
            <p class="subtitle">Premium Digital Asset Available</p>
            <a href="mailto:webdominiosvegas@gmail.com" class="contact-box">webdominiosvegas@gmail.com</a>
        </div>
    </div>

</body>
</html>
