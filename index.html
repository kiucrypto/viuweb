<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viuweb.com - Dominio en Venta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo de tormenta y relámpagos dinámicos en movimiento */
        .lightning-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #050510 0%, #000000 100%);
            z-index: -2;
        }

        @keyframes stormFlash {
            0%, 85%, 89%, 93%, 97%, 100% { opacity: 0.05; background: rgba(0, 100, 255, 0.05); }
            87%, 91%, 95% { opacity: 0.4; background: rgba(100, 200, 255, 0.25); }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            animation: stormFlash 5s infinite;
        }

        /* Elementos móviles y exóticos flotantes de fondo */
        .floating-shape {
            position: absolute;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(120, 0, 255, 0.15));
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(5px);
            animation: floatMove 10s ease-in-out infinite alternate;
            z-index: -1;
        }

        .shape-1 { width: 150px; height: 150px; top: 10%; left: 5%; border-radius: 40% 60% 70% 30% / 40% 50% 50% 60%; animation-duration: 8s; }
        .shape-2 { width: 200px; height: 200px; bottom: 10%; right: 5%; border-radius: 50%; animation-duration: 12s; }
        .shape-3 { width: 100px; height: 100px; top: 50%; right: 10%; border-radius: 30% 70% 40% 60%; animation-duration: 9s; }

        @keyframes floatMove {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-30px) rotate(180deg) scale(1.08); }
            100% { transform: translateY(20px) rotate(360deg) scale(0.92); }
        }

        /* Contenedor Adaptable para Celular, Tablet y Laptop */
        .container {
            max-width: 800px;
            width: 90%;
            padding: clamp(25px, 5vw, 50px) clamp(20px, 4vw, 40px);
            text-align: center;
            background: rgba(10, 10, 18, 0.82);
            border: 1.5px solid rgba(0, 242, 254, 0.35);
            border-radius: 28px;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.15), inset 0 0 25px rgba(0, 242, 254, 0.05);
            backdrop-filter: blur(12px);
            margin: 20px;
            animation: borderPulse 4s ease-in-out infinite alternate;
        }

        @keyframes borderPulse {
            0% { border-color: rgba(0, 242, 254, 0.25); box-shadow: 0 0 30px rgba(0, 100, 255, 0.1); }
            100% { border-color: rgba(0, 242, 254, 0.7); box-shadow: 0 0 60px rgba(0, 242, 254, 0.35); }
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
        }

            color: #00f2fe;
